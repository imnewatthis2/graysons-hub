<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayson Web</title>
</head>
<body style="margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <!-- Navbar / Header Area -->
    <header style="background-color: #1f1f1f; padding: 20px; text-align: center; border-bottom: 2px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h1 style="margin: 0; font-size: 2.5rem; letter-spacing: 1px; color: #00bcd4; text-transform: uppercase;">
            Grayson Web
        </h1>
    </header>

    <!-- Main Content Container -->
    <main style="max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center;">
        
        <h2 style="color: #ffffff; margin-bottom: 10px; font-weight: 400;">Movies & Game Websites List</h2>
        <p style="color: #aaa; font-size: 0.95rem; margin-top: 0; margin-bottom: 25px;">
            If your device security blocks the live view window below, use the blue button to open the list instantly.
        </p>

        <!-- iPad & Secure Network Compatibility Button -->
        <div style="margin-bottom: 30px;">
            <a href="https://google.com" 
               target="_blank" 
               style="display: inline-block; background-color: #00bcd4; color: #121212; padding: 14px 32px; text-decoration: none; font-weight: bold; font-size: 1.1rem; border-radius: 30px; box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4); transition: transform 0.2s, background-color 0.2s;">
               🚀 Open Document Link
            </a>
        </div>

        <!-- Google Doc Embed Frame Container -->
        <div style="border: 2px solid #333; border-radius: 12px; overflow: hidden; background-color: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <iframe src="https://google.com" 
                    width="100%" 
                    height="800" 
                    style="border: none; display: block;">
            </iframe>
        </div>

    </main>

    <!-- Simple Page Footer -->
    <footer style="text-align: center; padding: 40px 20px; color: #555; font-size: 0.85rem; margin-top: 60px; border-top: 1px solid #222;">
        &copy; 2026 Grayson Web. All rights reserved.
    </footer>

</body>
</html>
