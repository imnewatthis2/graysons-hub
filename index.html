<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayson's Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 30px;
        }
        header {
            background: #121212;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff2222;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .logo {
            font-family: "Brush Script MT", cursive;
            font-size: 32px;
            background: linear-gradient(45deg, #ff2222, #ff5555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            font-size: 22px;
            margin: 30px 0 15px 0;
            color: #ff3333;
            border-left: 4px solid #ff3333;
            padding-left: 10px;
        }
        /* Pure Text List Layout to minimize firewall scripting red flags */
        .list-container {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #222;
        }
        .row:last-child {
            border-bottom: none;
        }
        .game-title {
            font-size: 18px;
            font-weight: bold;
        }
        .key-badge {
            background: #ff2222;
            color: #fff;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255,34,34,0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">graysons hub</div>
    </header>

    <div class="container">
        
        <h2>⌨️ KEYBOARD COMMAND SYSTEM (Press keys on iPad keyboard to launch)</h2>
        
        <div class="list-container">
            <div class="row">
                <div class="game-title">🏈 Retro Bowl (Google Server)</div>
                <div class="key-badge">Press 1</div>
            </div>
            <div class="row">
                <div class="game-title">🎓 Retro Bowl College</div>
                <div class="key-badge">Press 2</div>
            </div>
            <div class="row">
                <div class="game-title">🏀 Basketball Stars</div>
                <div class="key-badge">Press 3</div>
            </div>
            <div class="row">
                <div class="game-title">🚙 Drive Mad</div>
                <div class="key-badge">Press 4</div>
            </div>
            <div class="row">
                <div class="game-title">🏍️ Moto X3M Original</div>
                <div class="key-badge">Press 5</div>
            </div>
            <div class="row">
                <div class="game-title">🧩 Tetris Premium</div>
                <div class="key-badge">Press 6</div>
            </div>
            <div class="row">
                <div class="game-title">🚀 Cat4z Proxy Network</div>
                <div class="key-badge">Press P</div>
            </div>
        </div>

    </div>

    <script>
        // Maps your mechanical keyboard keys directly to the unblocked game addresses
        document.addEventListener('keydown', function(event) {
            if (event.key === '1') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === '2') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === '3') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === '4') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === '5') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === '6') {
                window.open('https://googleusercontent.com', '_blank');
            }
            if (event.key === 'p' || event.key === 'P') {
                window.open('https://amazonaws.com', '_blank');
            }
        });
    </script>
</body>
</html>
