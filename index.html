<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
        }
        .music-btn {
            background-color: #1DB954;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s ease;
        }
        .music-btn:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>

    <a href="https://spotify.com" class="music-btn" target="_blank">Open Spotify</a>

</body>
</html>
