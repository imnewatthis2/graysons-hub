<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SoundCloud Streamer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #222;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(255, 85, 0, 0.3);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #ff5500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #e04b00;
        }
        #player-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SoundCloud Web Streamer</h2>
    <p>Paste any public SoundCloud track link below to load and play it:</p>
    
    <input type="text" id="track-url" placeholder="https://soundcloud.com">
    <br>
    <button onclick="loadTrack()">Load Music</button>

    <div id="player-container">
        <!-- The player will appear here -->
    </div>
</div>

<script>
function loadTrack() {
    const url = document.getElementById('track-url').value;
    const playerContainer = document.getElementById('player-container');
    
    if (!url) {
        alert('Please paste a SoundCloud URL first!');
        return;
    }

    // Encodes the URL safely and builds the official SoundCloud compliant embed player
    const embedUrl = "https://soundcloud.com" + encodeURIComponent(url) + "&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true";
    
    playerContainer.innerHTML = `<iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="${embedUrl}"></iframe>`;
}
</script>

</body>
</html>
